[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  # NEXT_PUBLIC_* variables are intentionally inlined by Next.js into the
  # client bundle and edge-function output at build time. Netlify's secrets
  # scanner flags them as "leaked" even though this is expected behaviour.
  # AI_API_URL and AI_MODEL are non-sensitive configuration values whose
  # plaintext also appears in .env.example as documentation.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,AI_API_URL,AI_MODEL"

[[plugins]]
  package = "@netlify/plugin-nextjs"
